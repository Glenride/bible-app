services:
  web:
    image: node:22-alpine
    container_name: bible-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app:ro
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    command: ["node", "server.js"]
    ports:
      - "3050:3000"
    networks:
      - default
      - thinktank_net

networks:
  default:
  thinktank_net:
    name: thinktank-os_default
    external: true
